[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencespine"
version = "0.5.0"
description = "Agent-agnostic evidence-bound conversation memory fabric"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "EvidenceSpine Contributors" }
]
keywords = ["agents", "memory", "llm", "handoff", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rivastava/EvidenceSpine"
Documentation = "https://github.com/rivastava/EvidenceSpine/tree/main/docs"
Issues = "https://github.com/rivastava/EvidenceSpine/issues"

[project.scripts]
evidencespine = "evidencespine.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
embeddings = ["fastembed>=0.3"]
a2a = ["a2a-sdk>=1.1.2", "a2a-sdk[fastapi]"]
all = [
  "mcp>=2.0",
  "fastembed>=0.3",
  "a2a-sdk>=1.1.2",
  "a2a-sdk[fastapi]",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    "ignore:label\\(\\) is deprecated:DeprecationWarning:a2a\\.utils\\.proto_utils",
]
